name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
jobs:
  buildAndroid:
    name: buildAndroid
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      
      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib --global update haxelib
          haxelib git hxcpp https://github.com/ShadowEngineTeam/hxcpp
          haxelib git lime https://github.com/QQQEB159/lime-8.2.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.3.2
          haxelib install hxvlc 2.0.1
          haxelib install hscript-iris 1.1.3
          haxelib git flxanimate https://github.com/FixedData/flxanimate
          haxelib git linc_luajit https://github.com/ShadowEngineTeam/linc_luajit
          haxelib install tjson 1.4.0
          haxelib list
      
      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_21_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Build Android
        id: build
        run: haxelib run lime build android -Dgradle-args="--stacktrace"
        continue-on-error: true

      - name: Dump AndroidManifest.xml
        if: always()
        run: |
          echo "=== AndroidManifest.xml (app/src/main/) ==="
          cat export/release/android/bin/app/src/main/AndroidManifest.xml 2>/dev/null || echo "File not found at app/src/main/"
          echo "=== AndroidManifest.xml (build/) ==="
          find export/release/android/bin/ -name "AndroidManifest.xml" 2>/dev/null | while read f; do
            echo "--- $f ---"
            cat "$f"
          done
          echo "=== END ==="

      - name: Upload build directory on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-dir
          path: export/release/android/bin/
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Build failed, see logs above"
          exit 1

      - name: Publish Artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: buildAndroid
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
